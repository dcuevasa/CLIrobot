[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clirobot"
version = "0.1.0"
description = "A beautiful, unified, ergonomic CLI for Hugging Face LeRobot with smart hardware profiles, robust keyboard input, and calibration management."
readme = "README.md"
authors = [{ name = "CLIrobot Contributors" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "lerobot>=0.4.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pyserial>=3.5",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "huggingface_hub>=0.20.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]
vision = [
    "opencv-python-headless>=4.8.0",
    "numpy>=1.24.0",
]

[project.scripts]
clirobot = "clirobot.cli:main"
clr = "clirobot.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["clirobot*"]
