[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clirobot"
version = "0.1.0"
description = "A beautiful, unified, ergonomic CLI and plugin hub for Hugging Face LeRobot with smart hardware profiles, dataset pipelines, robust keyboard input, and calibration management."
readme = "README.md"
authors = [{ name = "CLIrobot Contributors" }]
license = "Apache-2.0"
requires-python = ">=3.10"
keywords = [
    "lerobot",
    "robotics",
    "huggingface",
    "teleoperation",
    "imitation-learning",
    "embodied-ai",
    "cli",
    "tui",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "lerobot>=0.4.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pyserial>=3.5",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "huggingface_hub>=0.20.0",
]

[project.urls]
Homepage = "https://github.com/dcuevasa/CLIrobot"
Repository = "https://github.com/dcuevasa/CLIrobot"
Documentation = "https://github.com/dcuevasa/CLIrobot/tree/main/docs"
"Bug Tracker" = "https://github.com/dcuevasa/CLIrobot/issues"


[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]
vision = [
    "opencv-python-headless>=4.8.0",
    "numpy>=1.24.0",
]

[project.scripts]
clirobot = "clirobot.cli:main"
clr = "clirobot.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["clirobot*"]
