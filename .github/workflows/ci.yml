name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code Quality & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Check critical syntax and undefined symbols
        run: |
          uvx ruff check --select E9,F63,F7,F82 clirobot/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y linux-libc-dev libevdev-dev

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Create virtual environment
        run: |
          uv venv --python ${{ matrix.python-version }}
          echo "$PWD/.venv/bin" >> $GITHUB_PATH
          echo "VIRTUAL_ENV=$PWD/.venv" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          # Install evdev-binary and patch dist-info so evdev requirement is satisfied without source builds
          uv pip install evdev-binary
          python -c "
          import glob, shutil, os
          for d in glob.glob('.venv/lib/python*/site-packages'):
              src = os.path.join(d, 'evdev_binary-2.0.0.dist-info')
              dst = os.path.join(d, 'evdev-2.0.0.dist-info')
              if os.path.exists(src) and not os.path.exists(dst):
                  shutil.copytree(src, dst)
                  meta = os.path.join(dst, 'METADATA')
                  if os.path.exists(meta):
                      with open(meta, 'r') as f:
                          c = f.read().replace('Name: evdev-binary', 'Name: evdev')
                      with open(meta, 'w') as f:
                          f.write(c)
          "
          uv pip install -e ".[dev,vision]"

      - name: Run test suite with coverage
        run: |
          pytest tests/ -v --cov=clirobot --cov-report=xml --cov-report=term

      - name: Upload coverage report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  build:
    name: Package Build & Verification
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build wheel and sdist
        run: |
          uv build

      - name: Verify distribution archives
        run: |
          uvx twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
