name: Release & Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: |
          uv python install 3.11

      - name: Install dependencies & run tests
        run: |
          uv pip install evdev-binary
          uv pip install -e ".[dev,vision]"
          uv run pytest tests/ -v

      - name: Build distributions
        run: |
          uv build

      - name: Verify package archives
        run: |
          uvx twine check dist/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
          generate_release_notes: true

      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/') && env.PYPI_TOKEN_EXISTS == 'true'
        env:
          PYPI_TOKEN_EXISTS: ${{ secrets.PYPI_API_TOKEN != '' }}
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          uvx twine upload --skip-existing dist/*
