name: Release & Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y linux-libc-dev libevdev-dev

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Create virtual environment
        run: |
          uv venv --python 3.11
          echo "$PWD/.venv/bin" >> $GITHUB_PATH
          echo "VIRTUAL_ENV=$PWD/.venv" >> $GITHUB_ENV

      - name: Install dependencies & run tests
        run: |
          uv pip install evdev-binary
          python -c "
          import glob, shutil, os
          for d in glob.glob('.venv/lib/python*/site-packages'):
              src = os.path.join(d, 'evdev_binary-2.0.0.dist-info')
              dst = os.path.join(d, 'evdev-2.0.0.dist-info')
              if os.path.exists(src) and not os.path.exists(dst):
                  shutil.copytree(src, dst)
                  meta = os.path.join(dst, 'METADATA')
                  if os.path.exists(meta):
                      with open(meta, 'r') as f:
                          c = f.read().replace('Name: evdev-binary', 'Name: evdev')
                      with open(meta, 'w') as f:
                          f.write(c)
          "
          uv pip install -e ".[dev,vision]"
          pytest tests/ -v

      - name: Build distributions
        run: |
          uv build

      - name: Verify package archives
        run: |
          uvx twine check dist/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
          generate_release_notes: true

      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/') && env.PYPI_TOKEN_EXISTS == 'true'
        env:
          PYPI_TOKEN_EXISTS: ${{ secrets.PYPI_API_TOKEN != '' }}
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          uvx twine upload --skip-existing dist/*
